<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bracelete ESP32</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #000; color: #fff;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 100vh; gap: 1.5rem; padding: 1rem; box-sizing: border-box; text-align: center; }
  button { font-size: 1.6rem; padding: 1rem 2rem; border: 3px solid #ff0; background: #000;
           color: #ff0; border-radius: 12px; }
  #dist { font-size: 5rem; font-weight: 700; }
  #nivel { font-size: 2rem; padding: .5rem 1rem; border-radius: 8px; }
  .n0 { background: #063; } .n1 { background: #960; } .n2 { background: #c60; } .n3 { background: #c00; }
  .sem { background: #555; }
  #status { font-size: 1.1rem; color: #bbb; }
</style>
</head>
<body>
  <button id="conectar">Conectar ao bracelete</button>
  <div id="dist" aria-hidden="true">-- m</div>
  <div id="nivel" class="n0" role="status" aria-live="assertive">Desconectado</div>
  <div id="status">Aguardando conexão</div>

<script>
const SERVICE = '309229c8-9c1c-477a-a03f-3384523c5ebc';
const DIST = '09104702-68f7-4e84-b2d0-de4fe213ea52';
const FAIXAS = ['ao longe', 'à frente', 'próxima', 'muito perto'];
const VIBRA = [0, 100, 250, 500];

const $dist = document.getElementById('dist');
const $nivel = document.getElementById('nivel');
const $status = document.getElementById('status');
const SEM_BALIZA = 'Nenhuma baliza por perto';
let ultimoNivel = -1;
let leituras = 0;

function falar(texto) {
  speechSynthesis.cancel();
  speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(texto), { lang: 'pt-BR' }));
}

// Distância por RSSI é aproximada: arredonda para meio metro
function metros(cm) {
  const m = Math.max(0.5, Math.round(cm / 50) / 2);
  return m.toLocaleString('pt-BR');
}

// Payload: "<baliza>,<cm>,<nivel>,<demo>"; baliza vazia = nenhuma por perto
function onLeitura(event) {
  const [baliza, ...resto] = new TextDecoder().decode(event.target.value).split(',');
  const [cm, nivel, demo] = resto.map(Number);
  $status.textContent = `${demo ? 'MODO DEMONSTRAÇÃO — ' : ''}Recebendo dados: ${++leituras} leituras`;
  const achou = baliza && cm > 0;
  const estado = achou ? `${baliza}|${nivel}` : 'nenhuma';
  $dist.textContent = achou ? `~${metros(cm)} m` : '-- m';
  $nivel.className = achou ? `n${nivel}` : 'sem';
  $nivel.textContent = achou ? `${baliza} ${FAIXAS[nivel]}` : SEM_BALIZA;
  if (estado !== ultimoNivel) {
    falar(achou ? `${baliza} ${FAIXAS[nivel]}, cerca de ${metros(cm)} metros` : SEM_BALIZA);
    if (achou && VIBRA[nivel]) navigator.vibrate?.(VIBRA[nivel]);
    ultimoNivel = estado;
  }
}

document.getElementById('conectar').addEventListener('click', async () => {
  if (!navigator.bluetooth) {
    $nivel.textContent = 'Navegador sem Web Bluetooth. Use o Chrome no Android.';
    return;
  }
  try {
    const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    device.addEventListener('gattserverdisconnected', () => {
      $nivel.textContent = 'Desconectado';
      falar('Bracelete desconectado');
      $status.textContent = 'Sem dados';
      ultimoNivel = -1;
      leituras = 0;
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    const ch = await service.getCharacteristic(DIST);
    ch.addEventListener('characteristicvaluechanged', onLeitura);
    await ch.startNotifications();
    $nivel.textContent = 'Conectado';
    falar('Bracelete conectado');
  } catch (e) {
    $nivel.textContent = `Erro: ${e.message}`;
  }
});
</script>
</body>
</html>
